<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武林秘籍 · Denis LU 的档案馆</title>
    <meta name="description" content="Denis LU 的武林秘籍档案馆 —— 以 Markdown 卷宗记录代码江湖的修行心得。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="wuxia.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 分类检索 */
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .chip {
            font-family: var(--font-kai);
            padding: 8px 20px; letter-spacing: 3px; font-size: .9rem;
            color: var(--primary); background: rgba(196,163,90,.07);
            border: 1px solid var(--border-color); border-radius: 30px;
            cursor: pointer; transition: all .28s ease;
        }
        .chip:hover { transform: translateY(-2px); border-color: var(--primary); }
        .chip.active { color: var(--bg-primary); background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-color: var(--primary); }

        /* 秘籍卷宗卡 */
        .scroll-card { display: block; color: inherit; cursor: pointer; }
        .scroll-cat {
            display: inline-block; font-size: .78rem; letter-spacing: 3px;
            color: var(--seal); border: 1px solid rgba(179,50,42,.4);
            padding: 2px 12px; border-radius: 3px; margin-bottom: 14px;
            background: rgba(179,50,42,.06);
        }
        .scroll-title { font-family: var(--font-brush); font-size: 1.5rem; letter-spacing: 2px; color: var(--text-primary); margin-bottom: 10px; }
        .scroll-excerpt { color: var(--text-secondary); font-size: .95rem; min-height: 72px; }
        .scroll-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--paper-edge); font-size: .83rem; color: var(--text-muted); }
        .scroll-likes { margin-left: auto; }
        .scroll-likes.liked { color: var(--seal); }

        /* 文章详情（展开的卷宗） */
        .detail-back { margin-bottom: 26px; }
        .scroll-detail {
            background:
                linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.06)),
                var(--paper);
            border: 1px solid var(--paper-edge);
            border-radius: 6px;
            padding: clamp(28px, 5vw, 60px);
            position: relative;
        }
        .detail-head { text-align: center; margin-bottom: 36px; padding-bottom: 28px; border-bottom: 1px solid var(--paper-edge); }
        .detail-title { font-family: var(--font-brush); font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: 4px; margin: 16px 0 14px; color: var(--text-primary); }
        .detail-meta { color: var(--text-muted); font-size: .88rem; letter-spacing: 2px; }
        .detail-tags { margin-top: 14px; }

        .post-content { font-size: 1.04rem; color: var(--text-secondary); }
        .post-content h1, .post-content h2, .post-content h3 { font-family: var(--font-brush); color: var(--primary-light); letter-spacing: 2px; margin: 38px 0 16px; }
        .post-content h1 { font-size: 2rem; } .post-content h2 { font-size: 1.6rem; } .post-content h3 { font-size: 1.3rem; }
        .post-content p { margin: 18px 0; }
        .post-content ul, .post-content ol { margin: 18px 0; padding-left: 26px; }
        .post-content li { margin: 8px 0; }
        .post-content a { color: var(--primary); border-bottom: 1px solid var(--paper-edge); }
        .post-content a:hover { color: var(--primary-light); }
        .post-content blockquote {
            border-left: 3px solid var(--primary); background: var(--bg-card);
            padding: 14px 22px; margin: 26px 0; border-radius: 0 6px 6px 0;
            color: var(--text-primary); font-style: italic;
        }
        .post-content code {
            background: var(--bg-card); border: 1px solid var(--paper-edge);
            padding: 2px 7px; border-radius: 4px; font-family: 'Courier New', monospace;
            font-size: .88em; color: var(--primary-light);
        }
        .post-content pre { background: var(--bg-card); border: 1px solid var(--paper-edge); border-radius: 8px; padding: 20px; overflow-x: auto; margin: 24px 0; }
        .post-content pre code { background: none; border: none; padding: 0; color: var(--text-primary); }
        .post-content hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--border-color), transparent); margin: 38px 0; }
        .post-content strong { color: var(--primary-light); }
        .post-content table { width: 100%; border-collapse: collapse; margin: 24px 0; }
        .post-content th, .post-content td { border: 1px solid var(--paper-edge); padding: 10px 14px; text-align: left; }
        .post-content th { background: var(--bg-card); color: var(--primary-light); }
        .post-content img { border-radius: 8px; border: 1px solid var(--paper-edge); }

        /* 点赞 */
        .like-section { display: flex; justify-content: center; margin-top: 44px; padding-top: 32px; border-top: 1px solid var(--paper-edge); }
        .like-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 13px 30px; border-radius: 40px; cursor: pointer;
            font-family: var(--font-kai); font-size: 1.02rem; letter-spacing: 3px;
            color: var(--bg-primary); background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: 1px solid var(--primary); transition: transform .3s ease, box-shadow .3s ease;
        }
        .like-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
        .like-btn.liked { background: linear-gradient(135deg, #d2453a, var(--seal-dark)); border-color: #d2453a; color: #fff; }
        .like-btn .heart { font-size: 1.3rem; }
        .like-btn.liked .heart { animation: beat .6s ease; }
        @keyframes beat { 0%{transform:scale(1)} 30%{transform:scale(1.35)} 60%{transform:scale(.95)} 100%{transform:scale(1)} }
        .like-tip { text-align: center; color: var(--text-muted); font-size: .85rem; margin-top: 14px; }

        /* 卷宗四角角标 */
.scroll-detail .tick { position: absolute; width: 16px; height: 16px; opacity: .65; }
.scroll-detail .tick.tl { top: 12px; left: 12px; border-top: 1px solid; border-left: 1px solid; }
.scroll-detail .tick.tr { top: 12px; right: 12px; border-top: 1px solid; border-right: 1px solid; }
.scroll-detail .tick.bl { bottom: 12px; left: 12px; border-bottom: 1px solid; border-left: 1px solid; }
.scroll-detail .tick.br { bottom: 12px; right: 12px; border-bottom: 1px solid; border-right: 1px solid; }

        #toast-message {
            position: fixed; top: 50%; left: 50%; z-index: 10000;
            background: rgba(10,6,4,.88); color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 14px 28px; border-radius: 8px; letter-spacing: 2px;
        }
        .error-box { text-align: center; padding: 60px 20px; color: #e07a6f; }
        .error-box p { margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="index.html"><span class="brand-seal">侠</span>江湖</a>
            <button class="nav-toggle" id="navToggle" aria-label="菜单"><span></span><span></span><span></span></button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">归处</a></li>
                <li><a href="about.html">侠客档案</a></li>
                <li><a href="projects.html">兵器谱</a></li>
                <li><a href="blog.html" class="active">武林秘籍</a></li>
                <li><a href="index.html#contact">传信</a></li>
            </ul>
        </div>
    </nav>

    <main class="archive">
        <!-- 列表视图 -->
        <div id="blogList">
            <header class="archive-head">
                <div>
                    <div class="archive-kicker">武林秘籍 · SCROLL ARCHIVE</div>
                    <h1 class="archive-title">武林<span class="accent">秘籍</span></h1>
                    <p class="archive-sub">代码江湖，以文会友。此处典藏修行路上之心法、剑术与见闻，卷宗随取随阅，与君共勉。</p>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:18px;">
                    <div class="seal seal-stamp">秘籍<br>阁藏</div>
                    <div class="archive-meta">卷宗数 · <b id="postCount">6</b><br>载体 · <b>Markdown</b><br>编号 · <b>SCR-001</b></div>
                </div>
            </header>

            <section class="volume">
                <div class="volume-head reveal">
                    <span class="volume-no">卷一</span>
                    <h2 class="volume-title">秘籍目录</h2>
                    <span class="volume-en">Catalog</span>
                </div>
                <div class="filters reveal" id="categoryFilters"></div>
                <div class="grid grid-auto" id="postsGrid" style="margin-top:28px;">
                    <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>正在整理秘籍卷宗…</div>
                </div>
            </section>
        </div>

        <!-- 详情视图 -->
        <div id="blogDetail" style="display:none;">
            <button class="btn btn-ghost detail-back" id="backBtn">← 返回秘籍目录</button>
            <div id="postDetail"></div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 甲辰年 Denis LU · 江湖再见</p>
        <p style="margin-top:8px;"><a href="https://github.com/lccuhk" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script src="theme-manager.js"></script>
    <script>
        /* ================= 卷宗元数据 ================= */
        const postsMetadata = [
            { id:'hello-world', title:'初入江湖，代码为剑', date:'2025-01-15', category:'心法心得',
              tags:['编程','入门','学生','感悟'], excerpt:'聊聊我是怎么一头扎进代码这个江湖的，以及那些年踩过的坑、吃过的苦、还有那点小小的成就感。', file:'posts/hello-world.md' },
            { id:'react-hooks-guide', title:'React Hooks 踩坑指南', date:'2025-02-20', category:'前端剑术',
              tags:['React','Hooks','前端','踩坑'], excerpt:'聊聊我用 React Hooks 踩过的那些坑，以及总结出来的一些"保命"技巧。别问，问就是血和泪的教训。', file:'posts/react-hooks-guide.md' },
            { id:'python-ai-intro', title:'Python AI 入坑指南', date:'2025-03-10', category:'AI心法',
              tags:['Python','AI','机器学习','入门'], excerpt:'聊聊我是怎么从一个 Python 小白，一步步摸到 AI 门槛的。别被那些高大上的名词吓住，其实没你想的那么难。', file:'posts/python-ai-intro.md' },
            { id:'backend-microservices', title:'我的第一个开源项目踩坑实录', date:'2025-04-05', category:'项目实战',
              tags:['开源','项目','踩坑','学生'], excerpt:'聊聊我做第一个开源项目踩过的坑，从啥也不会到慢慢搞懂，都是血和泪的教训。', file:'posts/backend-microservices.md' },
            { id:'developer-tools', title:'学生党效率提升指南', date:'2025-04-20', category:'兵器谱',
              tags:['工具','效率','学生','VS Code'], excerpt:'聊聊我作为学生党，日常学习和写代码用到的那些神兵利器，用好这些工具，效率翻倍，早点写完作业早点玩。', file:'posts/developer-tools.md' },
            { id:'career-advice', title:'学生党避坑指南', date:'2025-05-05', category:'江湖阅历',
              tags:['学生','经验','避坑','学习'], excerpt:'聊聊我作为学生踩过的那些坑，从本科到硕士，从学习到生活，都是血和泪的教训。希望你能少走点弯路。', file:'posts/career-advice.md' }
        ];

        let currentCategory = 'all';
        let currentPostId = null;
        const CN = ['壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];
        const cnNo = i => CN[i] || (i + 1);

        // 适配 GitHub Pages 子路径：相对 blog.html 解析
        function getPostPath(file) {
            const url = new URL(file, window.location.href);
            return url.pathname + url.search;
        }
        function formatDate(s) {
            return new Date(s).toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
        }

        /* ================= 分类筛选 ================= */
        function initCategoryFilters() {
            const cats = ['all', ...new Set(postsMetadata.map(p => p.category))];
            const box = document.getElementById('categoryFilters');
            box.innerHTML = cats.map(c =>
                `<button class="chip ${c==='all'?'active':''}" data-cat="${c}">${c==='all'?'全部秘籍':c}</button>`
            ).join('');
            box.addEventListener('click', e => {
                const btn = e.target.closest('.chip');
                if (!btn) return;
                box.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                renderPosts();
            });
        }

        /* ================= 点赞（localStorage） ================= */
        function getLikes() { try { return JSON.parse(localStorage.getItem('blog_likes') || '{}'); } catch(e){ return {}; } }
        function saveLikes(d) { try { localStorage.setItem('blog_likes', JSON.stringify(d)); } catch(e){} }
        function getLikeData(id) {
            const d = getLikes()[id] || { count:0, liked:false };
            if (d.count === 0 && !d.liked) d.count = (id.charCodeAt(0) + id.length * 7) % 48 + 5; // 稳定的初始点赞数
            return d;
        }
        function toggleLike(id) {
            const all = getLikes();
            let d = all[id] || { count:0, liked:false };
            if (d.count === 0 && !d.liked) d.count = (id.charCodeAt(0) + id.length * 7) % 48 + 5;
            if (d.liked) { d.count = Math.max(0, d.count - 1); d.liked = false; }
            else { d.count += 1; d.liked = true; }
            all[id] = d; saveLikes(all);
            const btn = document.getElementById('likeBtn');
            if (btn) {
                btn.classList.toggle('liked', d.liked);
                btn.querySelector('.heart').textContent = d.liked ? '❤️' : '🤍';
                btn.querySelector('.lk-count').textContent = d.count;
                btn.querySelector('.lk-text').textContent = d.liked ? '已点赞' : '点赞支持';
            }
            showToast(d.liked ? '❤️ 感谢点赞！' : '已取消点赞');
        }
        let toastTimer = null;
        function showToast(msg) {
            let t = document.getElementById('toast-message');
            if (t) t.remove();
            t = document.createElement('div');
            t.id = 'toast-message';
            t.textContent = msg;
            document.body.appendChild(t);
            t.animate([{opacity:0, transform:'translate(-50%,-50%) scale(.85)'},{opacity:1, transform:'translate(-50%,-50%) scale(1)'}], {duration:250, fill:'forwards'});
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                t.animate([{opacity:1},{opacity:0}], {duration:300, fill:'forwards'});
                setTimeout(() => t.remove(), 300);
            }, 1800);
        }

        /* ================= 列表渲染 ================= */
        function renderPosts() {
            let list = postsMetadata.slice();
            if (currentCategory !== 'all') list = list.filter(p => p.category === currentCategory);
            list.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('postCount').textContent = postsMetadata.length;
            const grid = document.getElementById('postsGrid');
            if (!list.length) { grid.innerHTML = '<p class="muted" style="grid-column:1/-1;text-align:center;padding:40px;">暂无此类秘籍</p>'; return; }
            grid.innerHTML = list.map((p, i) => {
                const lk = getLikeData(p.id);
                return `
                <article class="file-card scroll-card reveal" data-id="${p.id}">
                    <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
                    <div class="file-no">卷宗 · ${cnNo(i)}</div>
                    <span class="scroll-cat">${p.category}</span>
                    <h3 class="scroll-title">${p.title}</h3>
                    <p class="scroll-excerpt">${p.excerpt}</p>
                    <div class="scroll-meta">
                        <span>📅 ${formatDate(p.date)}</span>
                        <span class="scroll-likes ${lk.liked?'liked':''}">${lk.liked?'❤️':'🤍'} ${lk.count}</span>
                    </div>
                </article>`;
            }).join('');
            grid.querySelectorAll('.scroll-card').forEach(card => {
                card.addEventListener('click', () => showPostDetail(card.dataset.id));
            });
            const io = new IntersectionObserver((es) => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), {threshold:.1});
            grid.querySelectorAll('.reveal').forEach(el => io.observe(el));
        }

        /* ================= 详情渲染 ================= */
        function parseMarkdown(md) {
            const m = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
            if (!m) return { metadata:{}, content: md };
            const meta = {};
            m[1].split('\n').forEach(line => {
                const i = line.indexOf(':');
                if (i === -1) return;
                const k = line.slice(0,i).trim();
                let v = line.slice(i+1).trim();
                if (v.startsWith('[') && v.endsWith(']')) {
                    v = v.slice(1,-1).split(',').map(s => s.trim().replace(/^["']|["']$/g,'')).filter(Boolean);
                }
                meta[k] = v;
            });
            return { metadata: meta, content: m[2] };
        }

        async function showPostDetail(id) {
            currentPostId = id;
            const url = new URL(window.location);
            url.searchParams.set('post', id);
            window.history.pushState({}, '', url);

            document.getElementById('blogList').style.display = 'none';
            document.getElementById('blogDetail').style.display = 'block';
            window.scrollTo({ top:0, behavior:'instant' });

            const post = postsMetadata.find(p => p.id === id);
            const box = document.getElementById('postDetail');
            if (!post) {
                box.innerHTML = '<div class="scroll-detail error-box"><p>❌ 秘籍不存在</p><button class="btn btn-ghost" onclick="showPostList()">← 返回秘籍目录</button></div>';
                return;
            }
            box.innerHTML = '<div class="scroll-detail"><div class="loading"><div class="spinner"></div>正在展开卷宗…</div></div>';

            const path = getPostPath(post.file);
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const md = await res.text();
                const { metadata, content } = parseMarkdown(md);
                marked.setOptions({ breaks:true, gfm:true });
                const html = marked.parse(content);
                const cat = metadata.category || post.category;
                const date = metadata.date || post.date;
                const tags = metadata.tags || post.tags;
                const title = metadata.title || post.title;
                const lk = getLikeData(id);

                box.innerHTML = `
                    <article class="scroll-detail">
                        <span class="tick tl" style="border-color:var(--primary)"></span>
                        <span class="tick tr" style="border-color:var(--primary)"></span>
                        <span class="tick bl" style="border-color:var(--primary)"></span>
                        <span class="tick br" style="border-color:var(--primary)"></span>
                        <header class="detail-head">
                            <span class="scroll-cat">${cat}</span>
                            <h1 class="detail-title">${title}</h1>
                            <div class="detail-meta">📅 ${formatDate(date)}</div>
                            <div class="detail-tags">${(tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
                        </header>
                        <div class="post-content">${html}</div>
                        <div class="like-section">
                            <button class="like-btn ${lk.liked?'liked':''}" id="likeBtn" onclick="toggleLike('${id}')">
                                <span class="heart">${lk.liked?'❤️':'🤍'}</span>
                                <span class="lk-count">${lk.count}</span>
                                <span class="lk-text">${lk.liked?'已点赞':'点赞支持'}</span>
                            </button>
                        </div>
                        <p class="like-tip">你的鼓励是我持续创作的动力 ❤️</p>
                    </article>`;
            } catch (err) {
                console.error('Load post error:', err, path);
                box.innerHTML = `
                    <div class="scroll-detail error-box">
                        <p>❌ 加载秘籍失败（${err.message}）</p>
                        <p style="color:var(--text-muted);font-size:.88rem;">尝试路径：${path}<br>请确认 posts 卷宗已部署，并强制刷新页面。</p>
                        <p style="margin-top:18px;"><button class="btn btn-ghost" onclick="showPostList()">← 返回秘籍目录</button></p>
                    </div>`;
            }
        }

        function showPostList() {
            currentPostId = null;
            const url = new URL(window.location);
            url.searchParams.delete('post');
            window.history.pushState({}, '', url);
            document.getElementById('blogDetail').style.display = 'none';
            document.getElementById('blogList').style.display = 'block';
            window.scrollTo({ top:0, behavior:'smooth' });
        }

        window.addEventListener('popstate', () => {
            const id = new URLSearchParams(window.location.search).get('post');
            if (id) showPostDetail(id); else showPostList();
        });

        /* ================= 启动 ================= */
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
        navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
        document.getElementById('backBtn').addEventListener('click', showPostList);
        const io = new IntersectionObserver((es) => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), {threshold:.1});
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));

        initCategoryFilters();
        renderPosts();
        const initialPost = new URLSearchParams(window.location.search).get('post');
        if (initialPost && postsMetadata.some(p => p.id === initialPost)) showPostDetail(initialPost);
    </script>
</body>
</html>
