<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兵器谱 · Denis LU 的 GitHub 宝库</title>
    <meta name="description" content="Denis LU 的兵器谱档案馆 —— GitHub 开源项目卷宗一览。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="wuxia.css">
    <style>
        /* 检索条 */
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; }
        .chip {
            font-family: var(--font-kai);
            padding: 9px 22px; letter-spacing: 3px; font-size: .92rem;
            color: var(--primary); background: rgba(196,163,90,.07);
            border: 1px solid var(--border-color); border-radius: 30px;
            cursor: pointer; transition: all .28s ease;
        }
        .chip:hover { transform: translateY(-2px); border-color: var(--primary); }
        .chip.active {
            color: var(--bg-primary);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: var(--primary);
        }
        /* 兵器卷宗 */
        .weapon { display: block; color: inherit; }
        .weapon-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
        .weapon-name { font-family: var(--font-brush); font-size: 1.45rem; letter-spacing: 2px; color: var(--primary-light); }
        .weapon-cat { font-size: .72rem; letter-spacing: 3px; color: var(--text-muted); margin: 4px 0 12px; text-transform: uppercase; }
        .weapon-desc { color: var(--text-secondary); font-size: .95rem; min-height: 50px; }
        .weapon-foot {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--paper-edge);
            font-size: .85rem; color: var(--text-muted);
        }
        .lang-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
        .weapon-date { margin-left: auto; }
        .count-note { color: var(--text-muted); font-size: .85rem; letter-spacing: 2px; margin-bottom: 18px; }
        .external { color: var(--primary); font-size: .8rem; letter-spacing: 2px; }
        .back-row { margin-top: 44px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="index.html"><span class="brand-seal">侠</span>江湖</a>
            <button class="nav-toggle" id="navToggle" aria-label="菜单"><span></span><span></span><span></span></button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">归处</a></li>
                <li><a href="about.html">侠客档案</a></li>
                <li><a href="projects.html" class="active">兵器谱</a></li>
                <li><a href="blog.html">武林秘籍</a></li>
                <li><a href="index.html#contact">传信</a></li>
            </ul>
        </div>
    </nav>

    <main class="archive">
        <header class="archive-head">
            <div>
                <div class="archive-kicker">兵器谱 · THE ARMORY</div>
                <h1 class="archive-title">兵器<span class="accent">谱</span></h1>
                <p class="archive-sub">收录 Denis LU 行走江湖所铸之各式兵器 —— GitHub 开源项目卷宗，按门派分门别类，可自取把玩。</p>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:18px;">
                <div class="seal seal-stamp">开源<br>非秘</div>
                <div class="archive-meta">
                    数据源 · <b>GitHub API</b><br>
                    用户 · <b>lccuhk</b><br>
                    编号 · <b>ARM-001</b>
                </div>
            </div>
        </header>

        <section class="volume">
            <div class="volume-head reveal">
                <span class="volume-no">卷一</span>
                <h2 class="volume-title">宝库卷宗</h2>
                <span class="volume-en">Repositories</span>
            </div>

            <div class="filters reveal" id="filters">
                <button class="chip active" data-filter="all">全部兵器</button>
                <button class="chip" data-filter="starred">⭐ 有星者</button>
                <button class="chip" data-filter="python">🐍 Python</button>
                <button class="chip" data-filter="frontend">🎨 前端</button>
            </div>
            <p class="count-note" id="countNote"></p>

            <div class="grid grid-auto" id="repoGrid">
                <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>正在调取宝库卷宗…</div>
            </div>

            <div class="back-row reveal">
                <a class="btn btn-ghost" href="index.html">← 返回江湖</a>
                <a class="btn" href="https://github.com/lccuhk" target="_blank" rel="noopener noreferrer" style="margin-left:12px;">前往 GitHub 宝库 →</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 甲辰年 Denis LU · 江湖再见</p>
        <p style="margin-top:8px;"><a href="https://github.com/lccuhk" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script src="theme-manager.js"></script>
    <script>
        // 移动端菜单
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
        navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

        // 滚动入场
        const io = new IntersectionObserver((entries) => {
            entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
        }, { threshold: 0.08 });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));

        // ---------- 兵器谱数据 ----------
        const languageColors = {
            Python:'#3572A5', JavaScript:'#f1e05a', HTML:'#e34c26', TypeScript:'#3178c6',
            Vue:'#41b883', CSS:'#563d7c', Java:'#b07219', 'C++':'#f34b7d', C:'#555555',
            'Jupyter Notebook':'#DA5B0B', Shell:'#89e051', default:'#9a8a6a'
        };
        const FRONT_LANGS = ['HTML','JavaScript','TypeScript','Vue','CSS','SCSS','Shell'];
        const CN = ['壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];
        const cnNo = i => CN[i] || (i + 1);

        const MOCK = [
            { name:'mini-pong-game', description:'Couple mini-pong-game in class', html_url:'https://github.com/lccuhk/mini-pong-game', language:'HTML', stargazers_count:0, forks_count:0, open_issues_count:0, updated_at:'2026-05-31T10:13:23Z' },
            { name:'ai-trader-customization', description:'AI-Trader 智能交易助手平台，含 AI 对话、风险控制、市场情报、策略编辑等功能。', html_url:'https://github.com/lccuhk/ai-trader-customization', language:'Python', stargazers_count:1, forks_count:0, open_issues_count:0, updated_at:'2026-05-31T09:17:07Z' },
            { name:'rl-doraemon', description:'强化学习相关项目探索。', html_url:'https://github.com/lccuhk/rl-doraemon', language:'Python', stargazers_count:0, forks_count:0, open_issues_count:0, updated_at:'2026-05-20T08:00:00Z' }
        ];

        let allProjects = [];
        let currentFilter = 'all';

        function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
        function fmtDate(d){ try { return new Date(d).toLocaleDateString('zh-CN',{year:'numeric',month:'short'}); } catch(e){ return ''; } }

        function renderProjects(list) {
            const grid = document.getElementById('repoGrid');
            document.getElementById('countNote').textContent = `共检索到 ${list.length} 件兵器`;
            if (!list.length) {
                grid.innerHTML = '<p class="muted" style="grid-column:1/-1;text-align:center;padding:40px;">此门暂无兵器</p>';
                return;
            }
            grid.innerHTML = list.map((p, i) => `
                <a class="file-card weapon reveal" href="${esc(p.html_url)}" target="_blank" rel="noopener noreferrer">
                    <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
                    <div class="weapon-top">
                        <div>
                            <div class="file-no">卷宗 · ${cnNo(i)}</div>
                            <div class="weapon-name">${esc(p.name)}</div>
                        </div>
                        <span class="external">查阅 ↗</span>
                    </div>
                    <div class="weapon-cat">GitHub Repository</div>
                    <p class="weapon-desc">${esc(p.description || '暂无描述')}</p>
                    <div class="weapon-foot">
                        <span><span class="lang-dot" style="background:${languageColors[p.language] || languageColors.default}"></span>${esc(p.language || '未知')}</span>
                        <span>⭐ ${p.stargazers_count || 0}</span>
                        <span>🍴 ${p.forks_count || 0}</span>
                        <span>🐛 ${p.open_issues_count || 0}</span>
                        <span class="weapon-date">${fmtDate(p.updated_at)}</span>
                    </div>
                </a>`).join('');
            grid.querySelectorAll('.reveal').forEach(el => io.observe(el));
        }

        function applyFilter(filter) {
            currentFilter = filter;
            let list = allProjects;
            if (filter === 'starred') list = allProjects.filter(p => (p.stargazers_count || 0) > 0);
            else if (filter === 'python') list = allProjects.filter(p => p.language === 'Python');
            else if (filter === 'frontend') list = allProjects.filter(p => FRONT_LANGS.includes(p.language));
            renderProjects(list);
        }

        document.getElementById('filters').addEventListener('click', (e) => {
            const btn = e.target.closest('.chip');
            if (!btn) return;
            document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilter(btn.dataset.filter);
        });

        fetch('https://api.github.com/users/lccuhk/repos?per_page=100&sort=updated')
            .then(r => { if (!r.ok) throw new Error('api'); return r.json(); })
            .then(data => {
                if (Array.isArray(data) && data.length) { allProjects = data; }
                else { allProjects = MOCK; }
                applyFilter(currentFilter);
            })
            .catch(() => { allProjects = MOCK; applyFilter(currentFilter); });
    </script>
</body>
</html>
